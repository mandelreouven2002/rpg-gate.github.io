name: בדיקת האתר

# Runs on every pull request: the data is valid, the site builds, no internal link is broken.
# A red check means the pull request should not be merged yet.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python3 scripts/check_site.py
