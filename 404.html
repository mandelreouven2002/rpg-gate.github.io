<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

    <!-- ייבוא פונט Assistant מ-Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- שימוש ב-Tailwind CSS לעיצוב מהיר ורספונסיבי -->

    <link rel="icon" type="image/x-icon" href="/static/rpg-game.png">

    <style>

        #background-overlay {

            z-index: -1; background-image: url('/static/rpg-bg.png');
            background-repeat: repeat; opacity: 0.025; pointer-events: none;

<body class="bg-[#FFFBEB] flex flex-col min-h-screen relative overflow-hidden">

        <p class="text-base text-stone-600">מנוהל ע"י <a href="https://roleplay.top/" class="text-indigo-600 hover:underline">גמ"ה - גלגול מיזמים התנדבותיים</a>.</p>
        <p class="text-base text-stone-600"><a href="https://lp.reuven.click" target="_blank" rel="noopener" class="text-indigo-600 hover:underline">ראובן מנדלוביץ׳</a></p>
